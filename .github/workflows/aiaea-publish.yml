name: Aiaea Build And Publish

on:
  push:
    branches: [cicd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    env:
      NEXUS_BASEURL: ${{ vars.NEXUS_BASEURL }}
      NEXUS_CI_PASSWORD: ${{ secrets.NEXUS_CI_PASSWORD }}
      NEXUS_CI_USERNAME: ${{ vars.NEXUS_CI_USERNAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Validate source
        run: |
          set -euo pipefail
          bun typecheck
          bun --cwd packages/app test

      - name: Build Linux OpenCode
        run: |
          set -euo pipefail
          bun --cwd packages/opencode run build --single
          packages/opencode/dist/opencode-linux-x64/bin/opencode --version

      - name: Package launcher
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/opencode/package.json').version")"
          revision="$(git rev-parse --short=12 HEAD)"
          archive="OpenCode.${version}+${revision}.tar.gz"
          mkdir -p dist/launchers/OpenCode
          tar -C packages/opencode/dist/opencode-linux-x64/bin -czf "dist/launchers/OpenCode/${archive}" opencode
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-linux-x64
          path: dist/launchers/OpenCode/${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Publish launcher to Nexus
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_BASEURL"
          test -n "$NEXUS_CI_USERNAME"
          test -n "$NEXUS_CI_PASSWORD"
          curl --fail --show-error --user "$NEXUS_CI_USERNAME:$NEXUS_CI_PASSWORD" --upload-file "dist/launchers/OpenCode/${ARCHIVE}" "$NEXUS_BASEURL/repository/raw-dev-hosted/launchers/OpenCode/${ARCHIVE}"
