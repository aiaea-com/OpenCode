name: Aiaea Build And Publish

on:
  push:
    branches: [cicd]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: aiaea
    container: oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    defaults:
      run:
        shell: bash
    env:
      NEXUS_BASEURL: ${{ vars.NEXUS_BASEURL }}
      NEXUS_CI_PASSWORD: ${{ secrets.NEXUS_CI_PASSWORD }}
      NEXUS_CI_USERNAME: ${{ vars.NEXUS_CI_USERNAME }}
      OPENCODE_CHANNEL: latest
      OPENCODE_CANDIDATE_VERSION: 2.0.27-RC1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          test "$(bun --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends build-essential curl git python3 python3-pip
          python3 -m pip install setuptools || pip install setuptools || true
          bun install --frozen-lockfile

      - name: Validate source
        run: |
          set -euo pipefail
          bun run --cwd packages/app typecheck
          bun run --cwd packages/cli typecheck
          bun run --cwd packages/app test

      - name: Determine publication target
        id: publication
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "nexus-repository=raw-prod-hosted" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "nexus-repository=raw-dev-hosted" >> "$GITHUB_OUTPUT"
          echo "version=${OPENCODE_CANDIDATE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Linux OpenCode
        env:
          OPENCODE_VERSION: ${{ steps.publication.outputs.version }}
        run: |
          set -euo pipefail
          bun ./packages/cli/script/build.ts --single
          actual_version="$(NO_COLOR=1 packages/cli/dist/cli-linux-x64/bin/opencode --version)"
          printf 'Expected executable version: %s; observed: %s\n' "$OPENCODE_VERSION" "$actual_version"
          test "$actual_version" = "opencode v${OPENCODE_VERSION}"
          sha256sum packages/cli/dist/cli-linux-x64/bin/opencode

      - name: Package launcher
        id: package
        env:
          OPENCODE_VERSION: ${{ steps.publication.outputs.version }}
        run: |
          set -euo pipefail
          version="${OPENCODE_VERSION}"
          revision="$(printf %.12s "$GITHUB_SHA")"
          archive="OpenCode.${version}+${revision}.tar.gz"
          mkdir -p dist/launchers/OpenCode
          tar -C packages/cli/dist/cli-linux-x64/bin -czf "dist/launchers/OpenCode/${archive}" opencode
          sha256sum "dist/launchers/OpenCode/${archive}"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-linux-x64
          path: dist/launchers/OpenCode/${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Publish launcher to Nexus
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_BASEURL"
          test -n "$NEXUS_CI_USERNAME"
          test -n "$NEXUS_CI_PASSWORD"
          curl --fail --show-error --user "$NEXUS_CI_USERNAME:$NEXUS_CI_PASSWORD" --upload-file "dist/launchers/OpenCode/${ARCHIVE}" "$NEXUS_BASEURL/repository/${{ steps.publication.outputs.nexus-repository }}/launchers/OpenCode/${ARCHIVE}"
