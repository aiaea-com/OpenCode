name: deploy-changelog

on:
  push:
    branches:
      - dev
    paths:
      - services/changelog/**
      - .github/workflows/deploy-changelog.yml
  workflow_dispatch:

concurrency:
  group: deploy-changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode' && github.ref_name == 'dev'
    runs-on: ubuntu-26.04
    container:
      image: darthjurassic/sdk@sha256:cd304eb082de4e26521716d78bffca3d613e39ae2f792684e6ccf86380e17f05
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/changelog
        run: bun typecheck

      - name: Test
        working-directory: services/changelog
        run: bun test

      - name: Deploy
        working-directory: services/changelog
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
